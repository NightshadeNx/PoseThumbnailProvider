name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore PoseThumbnailProvider.sln

      - name: Build (Release|x64)
        run: msbuild PoseThumbnailProvider.sln /p:Configuration=Release /p:Platform=x64

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: iscc PoseThumbnailProvider\Installer\PoseThumbnailProvider.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoseThumbnailProvider-Setup
          path: dist/*.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: PoseThumbnailProvider-Setup

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.exe'
          generate_release_notes: true
